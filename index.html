<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="일본어 문장과 단어를 복습하는 공개 학습 보관함" />
    <title>ことば 노트</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="ことば 노트 처음으로">
          <span class="brand-mark">こ</span>
          <span><strong>ことば 노트</strong><small>일본어 문장 보관함</small></span>
        </a>
        <span class="readonly-pill">읽기 전용</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">JAPANESE STUDY LIBRARY</p>
        <h1 id="page-title">문장을 모으고,<br /><em>퀴즈로 익힌다.</em></h1>
        <p>등록된 문장과 단어를 찾고, 짧은 복습 퀴즈를 풀어 보세요.</p>
      </section>

      <nav class="tabs" aria-label="학습 메뉴">
        <button class="tab active" data-view="library">문장 보관함 <b id="sentenceCount">0</b></button>
        <button class="tab" data-view="quiz">퀴즈</button>
      </nav>

      <section class="view" id="libraryView" aria-labelledby="library-title">
        <div class="section-head">
          <div><p class="eyebrow">LIBRARY</p><h2 id="library-title">배운 문장</h2></div>
          <label class="search"><span class="sr-only">문장 검색</span><input id="searchInput" type="search" placeholder="일본어, 뜻, 단어 검색" /></label>
        </div>
        <p id="resultLabel" class="result-label" aria-live="polite"></p>
        <div class="entry-list" id="entryList"></div>
        <div id="emptyState" class="empty-state hidden"><span>ことば</span><h3>아직 등록된 문장이 없습니다.</h3><p>관리 CLI로 학습 파일을 가져오면 이곳에 표시됩니다.</p></div>
      </section>

      <section class="view hidden" id="quizView" aria-labelledby="quiz-title">
        <div class="section-head"><div><p class="eyebrow">QUICK REVIEW</p><h2 id="quiz-title">오늘의 퀴즈</h2></div><span class="quiz-meta" id="quizMeta"></span></div>
        <article class="quiz-card" id="quizCard"></article>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
